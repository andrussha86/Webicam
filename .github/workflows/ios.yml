name: ios
on:
  push:
  pull_request:
  workflow_call:
jobs:
  core-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test --package-path ios/WebicamCore

  build-ipa:
    runs-on: macos-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd ios && xcodegen
      - name: Build (unsigned)
        run: |
          xcodebuild -project ios/Webicam.xcodeproj -scheme Webicam -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Webicam.app Payload/
          zip -qr Webicam.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Webicam-ipa
          path: Webicam.ipa
